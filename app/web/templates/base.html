<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ app_name }}">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body hx-boost="true">
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% if active != "/login" %}
  <nav class="tabbar">
    {% for href, label in [("/", "Inicio"), ("/plata", "Plata"), ("/deudas", "Deudas"), ("/cuerpo", "Cuerpo"), ("/listas", "Listas"), ("/dia", "Día")] %}
      <a href="{{ href }}" {% if active == href or (href != "/" and active.startswith(href)) or (href == "/listas" and active == "/mercado") %}aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  {% endif %}
</body>
</html>
