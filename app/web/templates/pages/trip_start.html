{% extends "base.html" %}
{% block layout %}market-layout{% endblock %}
{% block content %}
<header class="page-head">
  <h1>{{ ico('🛒') }}Ir al súper</h1>
  <p class="soft">Anotá cada precio a medida que lo agarrás. El total se va sumando solo.</p>
</header>

<div class="stack card">
  {% if pending %}
  <form method="post" action="/super/compra/empezar">
    <input type="hidden" name="from_list" value="true">
    <button class="block-btn">📋 Empezar con la lista de casa ({{ pending | length }})</button>
  </form>
  <p class="soft">{{ pending | map(attribute="name") | join_y }}.</p>
  {% endif %}
  <form method="post" action="/super/compra/empezar">
    <input type="hidden" name="from_list" value="false">
    <button class="block-btn {{ 'ghost' if pending }}">✏️ Empezar en blanco, solo precios</button>
  </form>
</div>
{% endblock %}
