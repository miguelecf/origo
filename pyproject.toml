[project]
name = "mentor"
version = "0.1.0"
description = "Registro personal de vida: plata, deudas, cuerpo, listas y check-in, con MCP para agentes"
authors = [
    { name = "Miguel Caraballo", email = "63631970+Miguelecf@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
